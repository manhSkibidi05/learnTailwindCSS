          class="flex group p-2 border border-graySecondary rounded-full overflow-hidden"

            class="outline-none"
            type="text"
            name=""
            id=""
            placeholder="Search here..."
          />
        </div>
      </section>

    <script>
      // xử lí phần chuyển trang
      const pageBtn = document.querySelectorAll(".control-page");
      const page = document.querySelector(".page-content");

      for (let index = 0; index < pageBtn.length; index++) {
        pageBtn[index].addEventListener("click", function () {
          switch (index) {
            case 0:
              page.innerHTML = `<div class="page-top grid grid-cols-2 border-b border-graySecondary justify-items-center">
            <div class="group hover:bg-graySecondary py-3 w-full flex justify-center cursor-pointer transition-all duration-200 ease-linear">
             <a class="text-md text-grayPrimary group-hover:text-lightPrimary transition-all duration-200 ease-linear">For you</a>
            </div>
            <div class="group hover:bg-graySecondary py-3 w-full flex justify-center cursor-pointer transition-all duration-200 ease-linear">
              <a class="text-md text-grayPrimary group-hover:text-lightPrimary transition-all duration-200 ease-linear">Following</a>
            </div>
            </div>`;
              break;
            case 1:
              page.innerHTML = `<h1 class="p-5 text-lg font-bold">Explore Page</h1>`;
              break;
            case 2:
              page.innerHTML = `<h1 class="p-5 text-lg font-bold">Notifications Page</h1>`;
              break;
            case 3:
              page.innerHTML = `<h1 class="p-5 text-lg font-bold">Messages Page</h1>`;
              break;
            case 4:
              page.innerHTML = `<h1 class="p-5 text-lg font-bold">Bookmarks Page</h1>`;
              break;
            case 5:
              page.innerHTML = `<h1 class="p-5 text-lg font-bold">Profile Page</h1>`;
              break;
            case 6:
              page.innerHTML = `<h1 class="p-5 text-lg font-bold">Settings Page</h1>`;
              break;
            default:
              break;
          }
          pageBtn[index].classList.add("bg-graySecondary");
          for (let j = 0; j < pageBtn.length; j++) {
            if (j !== index) {
              pageBtn[j].classList.remove("bg-graySecondary");
            }
          }
        });
      }

      // xử lí dark mode
      const btnDarkModes = document.querySelector(".btn-darkMode");
      btnDarkModes.addEventListener("click", function () {
        const html = document.querySelector("html");
        const textBtn = btnDarkModes.querySelector("a");
        html.classList.toggle("dark");
        if (html.classList.contains("dark")) {
          textBtn.innerText = "Switch to light";
        } else {
          textBtn.innerText = "Switch to dark";
        }
      });
    </script>
